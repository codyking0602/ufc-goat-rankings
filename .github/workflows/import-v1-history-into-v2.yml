name: Import V1 history into V2

on:
  push:
    branches:
      - agent/v1-data-export-for-v2
    paths:
      - .github/workflows/import-v1-history-into-v2.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/import-v1-history-into-v2.yml

permissions:
  contents: read

concurrency:
  group: octagon-v1-history-import-into-v2
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/v1-data-export-for-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V1_PROJECT_REF: hdkjwezaswhisxupxydc
      V1_SUPABASE_URL: https://hdkjwezaswhisxupxydc.supabase.co
      EXPORT_CUTOFF: 2026-07-25T00:00:00Z
      EXPORT_OUTPUT: /tmp/octagon-v1-import-payload.json
      FIRST_REPORT: /tmp/octagon-v1-import-first.json
      SECOND_REPORT: /tmp/octagon-v1-import-second.json
      COMBINED_REPORT: /tmp/octagon-v1-v2-reconciliation.json

    steps:
      - name: Check out exact isolated V1 export head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Resolve V1 service credential without printing it
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing Supabase management credential::SUPABASE_ACCESS_TOKEN is unavailable."
            exit 1
          fi
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${V1_PROJECT_REF}/api-keys")
          service_key=$(printf '%s' "$response" | jq -r '[.[] | select(.name == "service_role" or .name == "secret") | (.api_key // .key // empty)] | map(select(length > 0)) | first // empty')
          if [ -z "$service_key" ]; then
            echo "::error title=V1 service key unavailable::The management response did not include a V1 service credential."
            exit 1
          fi
          echo "::add-mask::$service_key"
          printf 'V1_SERVICE_ROLE_KEY=%s\n' "$service_key" >> "$GITHUB_ENV"

      - name: Build exact sanitized canonical V1 payload
        shell: bash
        run: |
          set -euo pipefail
          node scripts/export-v1-for-v2.mjs > /tmp/v1-export-summary.json
          test -s "$EXPORT_OUTPUT"
          chmod 600 "$EXPORT_OUTPUT"
          jq -e '
            .schemaVersion == 1 and
            .cutoff == "2026-07-25T00:00:00.000Z" and
            .rules.canonicalSixMemberGroupOnly == true and
            (.sourceGroupFingerprint | type == "string" and length > 0) and
            ([.profiles[].normalizedName] | sort) == ["BROCK","CODY","RHONDA","SHANE","TONY","TYLER"] and
            (.pickEvents | all(.status == "complete" and .startsAt < "2026-07-25T00:00:00.000Z")) and
            (.pickFights | all(.winnerFighterSlug == .redFighterSlug or .winnerFighterSlug == .blueFighterSlug))
          ' "$EXPORT_OUTPUT" > /dev/null

      - name: Discover exactly one canonical V2 target
        id: target
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          expected='["BROCK","CODY","RHONDA","SHANE","TONY","TYLER"]'
          projects=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects")
          candidate_count=0
          target_ref=''
          target_key=''

          while IFS= read -r project_ref; do
            [ -n "$project_ref" ] || continue
            [ "$project_ref" != "$V1_PROJECT_REF" ] || continue

            keys=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "https://api.supabase.com/v1/projects/${project_ref}/api-keys" 2>/dev/null || true)
            service_key=$(printf '%s' "$keys" | jq -r '[.[]? | select(.name == "service_role" or .name == "secret") | (.api_key // .key // empty)] | map(select(length > 0)) | first // empty' 2>/dev/null || true)
            [ -n "$service_key" ] || continue

            profile_rows=$(curl --silent --show-error \
              -H "apikey: ${service_key}" \
              -H "Authorization: Bearer ${service_key}" \
              "https://${project_ref}.supabase.co/rest/v1/profiles?select=normalized_name&normalized_name=in.(BROCK,CODY,RHONDA,SHANE,TONY,TYLER)&order=normalized_name.asc" || true)
            names=$(printf '%s' "$profile_rows" | jq -c '[.[].normalized_name] | sort' 2>/dev/null || true)
            [ "$names" = "$expected" ] || continue

            schema=$(curl --silent --show-error \
              -H "apikey: ${service_key}" \
              -H "Authorization: Bearer ${service_key}" \
              -H "Accept: application/openapi+json" \
              "https://${project_ref}.supabase.co/rest/v1/" || true)
            printf '%s' "$schema" | jq -e '.paths["/rpc/import_v1_history_atomic_reconciled"]' > /dev/null 2>&1 || continue

            candidate_count=$((candidate_count + 1))
            target_ref="$project_ref"
            target_key="$service_key"
          done < <(printf '%s' "$projects" | jq -r '.[] | .id // .ref // empty')

          if [ "$candidate_count" -ne 1 ] || [ -z "$target_ref" ] || [ -z "$target_key" ]; then
            echo "::error title=Canonical V2 target unresolved::Expected exactly one accessible non-V1 project with the canonical six profiles and atomic reconciliation RPC; found ${candidate_count}."
            exit 1
          fi

          echo "::add-mask::$target_key"
          printf 'V2_TARGET_REF=%s\n' "$target_ref" >> "$GITHUB_ENV"
          printf 'V2_SERVICE_ROLE_KEY=%s\n' "$target_key" >> "$GITHUB_ENV"
          echo "target_ref=$target_ref" >> "$GITHUB_OUTPUT"

      - name: Submit canonical payload atomically — first run
        shell: bash
        run: |
          set -euo pipefail
          jq -n --slurpfile payload "$EXPORT_OUTPUT" '{p_payload:$payload[0]}' > /tmp/v2-import-request.json
          status=$(curl --silent --show-error \
            --output "$FIRST_REPORT" \
            --write-out '%{http_code}' \
            --request POST \
            --header "apikey: ${V2_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${V2_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/v2-import-request.json \
            "https://${V2_TARGET_REF}.supabase.co/rest/v1/rpc/import_v1_history_atomic_reconciled")
          if [[ "$status" != 2* ]]; then
            echo "::error title=First atomic import rolled back::V2 returned HTTP ${status}."
            head -c 600 "$FIRST_REPORT"
            exit 1
          fi
          jq -e '.changes and .profiles and .recordScoringRules.missingSelectionCountsAsLoss == false and .recordScoringRules.predeterminedRecordExpected == false' "$FIRST_REPORT" > /dev/null

      - name: Submit exact same payload atomically — idempotency run
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error \
            --output "$SECOND_REPORT" \
            --write-out '%{http_code}' \
            --request POST \
            --header "apikey: ${V2_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${V2_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/v2-import-request.json \
            "https://${V2_TARGET_REF}.supabase.co/rest/v1/rpc/import_v1_history_atomic_reconciled")
          if [[ "$status" != 2* ]]; then
            echo "::error title=Second atomic import failed::V2 returned HTTP ${status}."
            head -c 600 "$SECOND_REPORT"
            exit 1
          fi

      - name: Verify zero-mutation rerun and write sanitized reconciliation
        shell: bash
        run: |
          set -euo pipefail
          checksum=$(sha256sum "$EXPORT_OUTPUT" | awk '{print $1}')
          jq -e '
            [.changes.avatarsInserted, .changes.findLeaderInserted, .changes.eventsInserted, .changes.boutsInserted, .changes.picksInserted]
            | all(. == 0)
          ' "$SECOND_REPORT" > /dev/null
          jq -e '.protectedBeforeHash == .protectedAfterHash' "$FIRST_REPORT" > /dev/null
          jq -e '.protectedBeforeHash == .protectedAfterHash' "$SECOND_REPORT" > /dev/null
          first_after=$(jq -r '.protectedAfterHash' "$FIRST_REPORT")
          second_before=$(jq -r '.protectedBeforeHash' "$SECOND_REPORT")
          [ "$first_after" = "$second_before" ]
          diff -u <(jq -S '.profiles' "$FIRST_REPORT") <(jq -S '.profiles' "$SECOND_REPORT")

          jq -n \
            --arg v1SourceSha "$GITHUB_SHA" \
            --arg v2TargetRef "$V2_TARGET_REF" \
            --arg payloadChecksum "$checksum" \
            --slurpfile first "$FIRST_REPORT" \
            --slurpfile second "$SECOND_REPORT" \
            '{
              schemaVersion: 1,
              v1SourceSha: $v1SourceSha,
              v2TargetRef: $v2TargetRef,
              payloadChecksum: $payloadChecksum,
              firstRun: $first[0],
              secondRun: $second[0]
            }' > "$COMBINED_REPORT"

          jq -c '{
            status:"reconciled",
            codyRecord:{
              wins:.firstRun.profiles.CODY.historicalPicksCorrect,
              losses:.firstRun.profiles.CODY.historicalPicksIncorrect,
              missing:.firstRun.profiles.CODY.historicalPicksMissing
            },
            codyFindLeader:{
              recordedDays:.firstRun.profiles.CODY.recordedDays,
              bestStreak:.firstRun.profiles.CODY.bestStreak,
              perfect10s:.firstRun.profiles.CODY.perfect10s,
              bestScore:.firstRun.profiles.CODY.bestScore
            },
            firstRunChanges:.firstRun.changes,
            secondRunChanges:.secondRun.changes,
            protectedHash:.firstRun.protectedAfterHash
          }' "$COMBINED_REPORT"

      - name: Upload one-day sanitized reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: octagon-v1-v2-reconciliation-${{ github.sha }}
          path: /tmp/octagon-v1-v2-reconciliation.json
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - name: Remove plaintext and temporary credentials from runner files
        if: always()
        shell: bash
        run: rm -f "$EXPORT_OUTPUT" "$FIRST_REPORT" "$SECOND_REPORT" "$COMBINED_REPORT" /tmp/v1-export-summary.json /tmp/v2-import-request.json

      - name: Record one-time migration boundary
        if: success()
        shell: bash
        run: |
          {
            echo "### V1 → V2 history import reconciled"
            echo "- Exact V1 source SHA: \`${GITHUB_SHA}\`"
            echo "- Canonical V2 target discovered by exact six-profile and RPC match"
            echo "- One atomic PostgreSQL mutation owner"
            echo "- Exact payload invoked twice"
            echo "- Second invocation produced zero mutations"
            echo "- July 25 and later Picks hashes remained unchanged"
            echo "- Missing selections were not counted as losses"
            echo "- No predetermined Cody Picks record was used"
          } >> "$GITHUB_STEP_SUMMARY"
