name: Recover Ankalaev-Guskov Picks

on:
  push:
    branches:
      - ops/recover-ankalaev-guskov-picks
    paths:
      - .github/workflows/recover-ankalaev-guskov-picks.yml
      - scripts/recover-ankalaev-guskov-picks.mjs
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/recover-ankalaev-guskov-picks.yml
      - scripts/recover-ankalaev-guskov-picks.mjs

permissions:
  contents: read

concurrency:
  group: recover-ankalaev-guskov-picks
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V1_PROJECT_REF: hdkjwezaswhisxupxydc
      V2_PROJECT_REF: rvbspcjvebgwqzssayts
      V1_SUPABASE_URL: https://hdkjwezaswhisxupxydc.supabase.co
      V2_SUPABASE_URL: https://rvbspcjvebgwqzssayts.supabase.co
      RECOVERY_REPORT: /tmp/ankalaev-guskov-pick-recovery.json
      DIAGNOSTIC_LOG: /tmp/ankalaev-guskov-pick-recovery.log

    steps:
      - name: Check out exact operational branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Resolve both service credentials without printing them
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing Supabase management credential::SUPABASE_ACCESS_TOKEN is unavailable."
            exit 1
          fi
          resolve_key() {
            local project_ref="$1"
            local env_name="$2"
            local response service_key
            response=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "https://api.supabase.com/v1/projects/${project_ref}/api-keys")
            service_key=$(printf '%s' "$response" | jq -r '[.[] | select(.name == "service_role" or .name == "secret") | (.api_key // .key // empty)] | map(select(length > 0)) | first // empty')
            if [ -z "$service_key" ]; then
              echo "::error title=Service credential unavailable::No service credential was returned for ${project_ref}."
              exit 1
            fi
            echo "::add-mask::$service_key"
            printf '%s=%s\n' "$env_name" "$service_key" >> "$GITHUB_ENV"
          }
          resolve_key "$V1_PROJECT_REF" V1_SERVICE_ROLE_KEY
          resolve_key "$V2_PROJECT_REF" V2_SERVICE_ROLE_KEY

      - name: Audit and recover exact picks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/recover-ankalaev-guskov-picks.mjs 2>&1 | tee "$DIAGNOSTIC_LOG"
          test -s "$RECOVERY_REPORT"

      - name: Upload one-day recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ankalaev-guskov-pick-recovery-${{ github.sha }}
          path: |
            /tmp/ankalaev-guskov-pick-recovery.json
            /tmp/ankalaev-guskov-pick-recovery.log
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0

      - name: Record recovery boundary
        if: success()
        shell: bash
        run: |
          {
            echo "### Ankalaev-Guskov Picks recovered"
            echo "- Exact operational source SHA: \`${GITHUB_SHA}\`"
            echo "- Source: canonical six-member V1 production group"
            echo "- Entrants required: Cody and Shane only"
            echo "- Six selections required for each entrant"
            echo "- Matching existing V2 rows preserved"
            echo "- Only missing selections and proven Underdog Locks inserted"
            echo "- Official results and event status were not changed"
            echo "- Second pass produced zero mutations"
            echo "- Unrelated V2 data hash remained unchanged"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary runner files
        if: always()
        shell: bash
        run: rm -f "$RECOVERY_REPORT" "$DIAGNOSTIC_LOG"
