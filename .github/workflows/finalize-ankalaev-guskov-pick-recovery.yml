name: Finalize Ankalaev-Guskov Pick Recovery

on:
  push:
    branches:
      - ops/recover-ankalaev-guskov-picks
    paths:
      - .github/workflows/finalize-ankalaev-guskov-pick-recovery.yml
      - scripts/freeze-stranded-ankalaev-guskov-locks.mjs
      - scripts/recover-ankalaev-guskov-picks.mjs

permissions:
  contents: read

concurrency:
  group: recover-ankalaev-guskov-picks
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V1_PROJECT_REF: hdkjwezaswhisxupxydc
      V2_PROJECT_REF: rvbspcjvebgwqzssayts
      V1_SUPABASE_URL: https://hdkjwezaswhisxupxydc.supabase.co
      V2_SUPABASE_URL: https://rvbspcjvebgwqzssayts.supabase.co
      RECOVERY_REPORT: /tmp/ankalaev-guskov-pick-recovery.json
      RECOVERY_LOG: /tmp/ankalaev-guskov-pick-recovery.log
      LOCK_LOG: /tmp/ankalaev-guskov-lock-recovery.log

    steps:
      - name: Check out exact operational head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Resolve both service credentials without printing them
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing Supabase management credential::SUPABASE_ACCESS_TOKEN is unavailable."
            exit 1
          fi
          resolve_key() {
            local project_ref="$1"
            local env_name="$2"
            local response service_key
            response=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "https://api.supabase.com/v1/projects/${project_ref}/api-keys")
            service_key=$(printf '%s' "$response" | jq -r '[.[] | select(.name == "service_role" or .name == "secret") | (.api_key // .key // empty)] | map(select(length > 0)) | first // empty')
            if [ -z "$service_key" ]; then
              echo "::error title=Service credential unavailable::No service credential was returned for ${project_ref}."
              exit 1
            fi
            echo "::add-mask::$service_key"
            printf '%s=%s\n' "$env_name" "$service_key" >> "$GITHUB_ENV"
          }
          resolve_key "$V1_PROJECT_REF" V1_SERVICE_ROLE_KEY
          resolve_key "$V2_PROJECT_REF" V2_SERVICE_ROLE_KEY

      - name: Freeze only stranded matching V2 locks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/freeze-stranded-ankalaev-guskov-locks.mjs 2>&1 | tee "$LOCK_LOG"

      - name: Reconcile the final card and missing picks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/recover-ankalaev-guskov-picks.mjs 2>&1 | tee "$RECOVERY_LOG"
          test -s "$RECOVERY_REPORT"

      - name: Upload one-day exact recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ankalaev-guskov-final-recovery-${{ github.sha }}
          path: |
            /tmp/ankalaev-guskov-pick-recovery.json
            /tmp/ankalaev-guskov-pick-recovery.log
            /tmp/ankalaev-guskov-lock-recovery.log
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0

      - name: Record exact recovery boundary
        if: success()
        shell: bash
        run: |
          {
            echo "### Ankalaev-Guskov recovery completed"
            echo "- Exact operational head: \`${GITHUB_SHA}\`"
            echo "- Existing V2 selections remained authoritative"
            echo "- V1 filled only missing selections and Shane's sheet"
            echo "- The stale Bonfim-Sola slot was replaced by Izagakhmaev-Vagaev"
            echo "- Matching stranded V2 lock odds were frozen from stored positive odds"
            echo "- Twelve final selections were required"
            echo "- Second recovery pass made zero changes"
            echo "- No official result or event status was changed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary runner files
        if: always()
        shell: bash
        run: rm -f "$RECOVERY_REPORT" "$RECOVERY_LOG" "$LOCK_LOG"
